<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join your company — Referleey</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2b3fd6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Referleey</a>
      <div>
        <h2>Refer people you'd love to work with.</h2>
        <p>Create your account to see open roles, refer candidates and follow their progress.</p>
      </div>
      <p class="small">A Leeys Technology product</p>
    </aside>
    <main class="auth-main">
      <form class="auth-form" id="f" novalidate>
        <h1 id="title">Join your company's referral program</h1>
        <p class="sub" id="sub">Enter the invite code from your admin.</p>
        <div class="form-error hidden" role="alert"></div>
        <div class="field" id="code-field"><label for="code">Invite code</label><input id="code" name="code" maxlength="20" required></div>
        <div class="field"><label for="name">Your name</label><input id="name" name="name" maxlength="80" autocomplete="name" required></div>
        <div class="field-row">
          <div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="department">Department</label><input id="department" name="department" maxlength="60" placeholder="Optional"></div>
        </div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><p class="hint">At least 8 characters.</p></div>
        <button class="btn btn-block" type="submit">Create account</button>
        <p class="auth-alt">Already have an account? <a href="/login">Sign in</a></p>
      </form>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    const code = new URLSearchParams(location.search).get('code');
    if (code) {
      $('#code').value = code;
      api('/public/invite/' + encodeURIComponent(code)).then((d) => {
        $('#title').textContent = 'Join ' + d.company + ' on Referleey';
        $('#sub').textContent = 'Create your account to start referring.';
        $('#code-field').classList.add('hidden');
      }).catch(() => {
        $('#sub').textContent = "This invite link isn't valid any more. Ask your admin for a new one, or enter a code below.";
        $('#code').value = '';
      });
    }
    handleForm($('#f'), async (d) => { await api('/auth/join', { method: 'POST', body: d }); location.href = '/app'; });
      track('page', 'join');
  </script>
</body>
</html>
