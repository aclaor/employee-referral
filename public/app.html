<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Referleey</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2b3fd6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <a class="brand" href="#/overview"><span class="brand-mark" aria-hidden="true"></span>Referleey</a>
      <div class="co"><strong id="co-name"></strong><span id="co-role"></span></div>
      <nav id="nav" aria-label="Workspace"></nav>
      <div class="me"><strong id="me-name"></strong><span id="me-email"></span><button type="button" id="logout">Sign out</button></div>
    </aside>
    <main class="main">
      <button class="btn btn-quiet btn-sm menu-btn" type="button" id="menu">Menu</button>
      <div id="view"><p class="muted">Loading…</p></div>
    </main>
  </div>
  <dialog id="dlg"></dialog>
  <script src="/js/common.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
